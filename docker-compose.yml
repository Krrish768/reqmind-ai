services:
  postgres:
    image: postgres:16
    container_name: reqmind_postgres
    environment:
      POSTGRES_USER: reqmind_user
      POSTGRES_PASSWORD: reqmind_pass
      POSTGRES_DB: reqmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

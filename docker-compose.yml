# Services for ReqMind AI.
#
#   docker compose up -d                              Postgres + Silo (enough with configs/cpu_laptop.yaml)
#   docker compose --profile ai up -d                 + Redis, Qdrant, Neo4j (configs/gpu_laptop.yaml)
#   docker compose --profile app up -d --build        everything, with the API and the worker in containers
#                                                     (configs/docker.yaml)
#
# Ollama is not in here: it runs on the host and the containers reach it at host.docker.internal.

x-app: &app
  build: .
  image: reqmind-ai:latest
  environment:
    APP_CONFIG: docker
    DATABASE_URL: postgresql+psycopg2://reqmind_user:reqmind_pass@postgres:5432/reqmind_db
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    NEO4J_PASSWORD: reqmind_neo4j_pass
    MINIO_ACCESS_KEY: reqmind_minio
    MINIO_SECRET_KEY: reqmind_minio_pass
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    - postgres
    - minio
    - redis
    - qdrant
    - neo4j
  restart: unless-stopped

services:
  # ---------- default: needed on every machine ----------
  postgres:
    image: postgres:16
    container_name: reqmind_postgres
    environment:
      POSTGRES_USER: reqmind_user
      POSTGRES_PASSWORD: reqmind_pass
      POSTGRES_DB: reqmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    # Silo: community fork of MinIO, same API and MINIO_* variables. The official
    # minio/minio image was removed from Docker Hub in 2026.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: reqmind_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reqmind_minio
      MINIO_ROOT_PASSWORD: reqmind_minio_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ---------- profile "ai" (and "app"): queue, vector search, graph ----------
  redis:
    image: redis:7-alpine
    container_name: reqmind_redis
    profiles: ["ai", "app"]
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: reqmind_qdrant
    profiles: ["ai", "app"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    container_name: reqmind_neo4j
    profiles: ["ai", "app"]
    environment:
      NEO4J_AUTH: neo4j/reqmind_neo4j_pass
      # small limits so it fits next to the LLM on a 16 GB laptop
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  # ---------- profile "app": the API and the worker in containers ----------
  backend:
    <<: *app
    container_name: reqmind_backend
    profiles: ["app"]
    ports:
      - "8000:8000"

  worker:
    <<: *app
    container_name: reqmind_worker
    profiles: ["app"]
    command: ["python", "-m", "scripts.run_worker"]
    healthcheck:
      disable: true

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  neo4j_data:

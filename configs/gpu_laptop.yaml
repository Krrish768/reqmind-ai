# Laptop with an NVIDIA GPU (8 GB) and Ollama on the host.
# All services run from docker compose: `docker compose --profile ai up -d`.
ai_enabled: true
seed: 42
cors_origins:
  - http://localhost:5500
  - http://127.0.0.1:5500

ollama:
  host: http://localhost:11434
  llm_model: qwen3:8b
  embed_model: nomic-embed-text
  # 4096 tokens keeps qwen3:8b and the embed model inside 8 GB of VRAM together
  num_ctx: 4096
  timeout_seconds: 300
  keep_alive: 10m

redis:
  enabled: true
  url: redis://localhost:6379/0
  queue_name: analysis

qdrant:
  enabled: true
  url: http://localhost:6333
  collection: reqmind_chunks

neo4j:
  enabled: true
  uri: bolt://localhost:7687
  user: neo4j

minio:
  endpoint: localhost:9000
  bucket: reqmind-documents
  secure: false

ingestion:
  max_upload_mb: 10
  chunk_chars: 1200
  overlap_chars: 150

analysis:
  max_chunks: 40
  conflict_similarity: 0.80
  max_conflict_pairs: 30
  job_timeout_seconds: 3600

chat:
  top_k: 5
